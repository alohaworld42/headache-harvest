<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Schmerzverlauf – Schmerztagebuch für Kopfschmerz und Migräne</title>
    <meta
      name="description"
      content="Kopfschmerzen und Migräne in Sekunden erfassen, Auslöser erkennen und einen Arztbericht als PDF mitnehmen. Alle Daten bleiben lokal auf deinem Gerät."
    />
    <meta name="theme-color" content="#f7f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f151f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Schmerzverlauf" />

    <link rel="icon" href="%BASE_URL%favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- Absolute, and always the live domain: the Pages preview and the *.vercel.app
         URL serve the same app, so pointing search engines and link previews at one
         canonical host keeps them from competing with each other. SITE_URL overrides it. -->
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:site_name" content="Schmerzverlauf" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="Schmerzverlauf – Schmerztagebuch für Kopfschmerz und Migräne" />
    <meta
      property="og:description"
      content="Migräne und Kopfschmerzen erfassen, Muster erkennen, Arztbericht drucken. Privat, offline-fähig, ohne Konto."
    />
    <!-- Crawlers for link previews do not resolve relative image paths. -->
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:alt" content="Schmerzverlauf – Kalender und Auswertung eines Kopfschmerztagebuchs" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- No web fonts: the system stack keeps the app fast and free of third-party requests. -->
    <style>
      :root {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          'Noto Sans',
          Arial,
          sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
